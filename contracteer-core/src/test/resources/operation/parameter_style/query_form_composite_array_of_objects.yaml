openapi: 3.0.0
info:
  title: Form Composite Array Of Objects Test
  version: '1.0'
paths:
  /test:
    get:
      parameters:
        - in: query
          name: inputs
          style: form
          explode: false
          schema:
            oneOf:
              - type: array
                items:
                  type: object
                  properties:
                    color:
                      type: string
              - type: array
                items:
                  type: object
                  properties:
                    size:
                      type: integer
      responses:
        '200':
          description: Success