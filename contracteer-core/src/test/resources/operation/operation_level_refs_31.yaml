openapi: "3.1.0"
info:
  title: Order API
  version: '1.0'
paths:
  /products/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/filter"
        - $ref: "#/components/parameters/trace"
        - $ref: "#/components/parameters/session"
      responses:
        200:
          description: OK
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: integer
    filter:
      in: query
      name: filter
      required: false
      schema:
        type: string
    trace:
      in: header
      name: x-trace
      required: true
      schema:
        type: string
    session:
      in: cookie
      name: session
      required: false
      schema:
        type: string