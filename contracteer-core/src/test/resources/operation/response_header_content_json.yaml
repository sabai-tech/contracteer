openapi: 3.0.0
info:
  title: Response Header Content Tests
  version: '1.0'
paths:
  /items:
    get:
      responses:
        '200':
          description: Success
          headers:
            X-Pagination:
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      page:
                        type: integer
                      total:
                        type: integer